[package]
name = "strawberry-studios"
version = "0.1.0"
description = "Strawberry Studios desktop shell"
authors = ["Strawberry Studios"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5.6" }

[dependencies]
tauri = { version = "1.8.2", features = ["api-all"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
